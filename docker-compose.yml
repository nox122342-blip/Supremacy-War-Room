services:
  api:
    build: .
    restart: unless-stopped
    environment:
      API_PORT: "3001"
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run api:setup to generate .env first}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL in .env}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SERVICE_ROLE_KEY in .env}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
